name: Discover short-answer content questions

on:
  schedule:
    # Monday 8:45 AM India Standard Time (03:15 UTC)
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find recurring public questions for editorial review
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discover-comment-questions.mjs
